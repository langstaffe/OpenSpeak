<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpenSpeak Web">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    html, body { height: 100%; margin: 0; background: #202225; }
    #loading { display: grid; height: 100%; place-items: center; color: #dcddde; font: 600 18px system-ui, sans-serif; }
  </style>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <title>OpenSpeak</title>
</head>
<body>
  <div id="loading" role="status">OpenSpeak 正在加载，首次打开请稍候…</div>
  <script>
    (() => {
      const isIOSWebKit = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOSWebKit) {
        document.addEventListener('touchstart', (event) => {
          if (window.innerWidth < 720 &&
              event.touches.length === 1 &&
              event.touches[0].clientX <= 20 &&
              event.cancelable) {
            event.preventDefault();
          }
        }, {capture: true, passive: false});
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
